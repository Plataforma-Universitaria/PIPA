spring.application.name=PIPA
guara.api-key=guara-integration-key
ai.gateway.mode=${AI_ROUTING_MODE:EXTERNAL_ONLY}
ai.gateway.service-key=${AI_GATEWAY_SERVICE_KEY:}
ai.gateway.local-base-url=${AI_LOCAL_BASE_URL:http://localhost:11434/v1}
ai.gateway.local-model=${AI_LOCAL_MODEL:}
ai.gateway.external-base-url=${AI_EXTERNAL_BASE_URL:https://api.openai.com/v1}
ai.gateway.external-model=${OPENAI_API_MODEL:gpt-4o-mini}
ai.gateway.external-api-key=${OPENAI_API_KEY:}
ai.gateway.timeout=${AI_GATEWAY_TIMEOUT:90s}
observability.session.ttl=${OBSERVABILITY_SESSION_TTL_SEC:3600}s
observability.session.cleanup-interval=${OBSERVABILITY_SESSION_CLEANUP_INTERVAL:60}s
root.package=br.ueg.tc.
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.model.moderation=none

spring.datasource.url=${DB_ADDRESS}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.public-key = ${PUBLIC_KEY}
logging.level.org.springframework.core.env=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG
cross = *

spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}
spring.mail.password=${EMAIL_APP_PW}
spring.mail.username=${EMAIL}


spring.security.user.name=${USER_ADMIN}
spring.security.user.password=${USER_PASS}
